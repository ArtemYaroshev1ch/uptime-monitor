name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N) publishes the image to ghcr.io and creates a
# GitHub Release. The process is described in docs/ci-cd.md.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway through.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # ghcr.io/<owner>/<repo>; metadata-action lowercases it, as ghcr.io needs.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # The full CI (tests, scans, e2e) on the tagged commit: nothing is
  # published from a commit that would not pass it.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check below needs the history of main

      # A release is cut from main only: a tag on an unmerged branch would
      # publish code that nobody reviewed and that main does not contain.
      - name: The tag points to a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Build metadata
        id: build-meta
        run: |
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Tags: X.Y.Z from the git tag (without "v") and sha-<12 hex digits>,
      # the same short commit /version reports. Never "latest": a deployment
      # always names an exact version (decision 045).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU: the Dockerfile cross-compiles on the runner's platform
      # (BUILDPLATFORM), and the runtime stage only copies files.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.build-meta.outputs.commit }}
            BUILT_AT=${{ steps.build-meta.outputs.built_at }}
          # Build provenance and an SBOM are attached to the image in the
          # registry: where and from what it was built, which packages it has.
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # The image that was pushed must report the version of the tag.
      - name: Verify the published image
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          WANT: ${{ steps.meta.outputs.version }}
        run: |
          ref=$(echo "$REF" | tr '[:upper:]' '[:lower:]')
          got=$(docker run --rm "$ref" /app/api -version)
          echo "$got"
          echo "$got" | grep -q "$WANT"

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the history and older tags

      - name: Release notes
        env:
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          image=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          {
            sh scripts/changelog.sh "$GITHUB_REF_NAME"
            echo
            echo '### Image'
            echo
            echo '```'
            echo "docker pull $image:$VERSION"
            echo '```'
            echo
            echo "Platforms: linux/amd64, linux/arm64. Digest: \`$DIGEST\`."
            echo "Run \`/app/migrate up\` before starting the new api and worker."
          } > notes.md
          cat notes.md

      # gh is preinstalled on the runners: no third-party release action.
      # A tag with a suffix (v1.0.0-rc.1) becomes a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md)
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
