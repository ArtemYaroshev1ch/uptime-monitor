# Local stack: PostgreSQL, migrations, api and worker.
#
#   cp .env.example .env && docker compose up --build    # everything
#   make up / make down / make logs / make smoke
#   make db                                               # PostgreSQL only,
#                                                         # for make run-api
#
# Start order: postgres (healthy) -> migrate (exits 0) -> api, worker. The
# application settings come from .env; the addresses and the database URL
# that only make sense inside this network are set here and win over .env.
#
# Every port is published on 127.0.0.1 only. The ops ports (9090, 9091) are
# published for local inspection (curl, a local Prometheus); a production
# deployment (uptime-infra) never publishes them.
#
# Credentials below are for a throwaway local database; override them in
# .env (compose reads it for ${...} as well).

name: uptime-monitor

# Shared by migrate, api and worker: one image (one build) with three
# commands, hardened containers.
x-app: &app
  image: uptime-monitor:${VERSION:-dev}
  build:
    context: .
    args:
      VERSION: ${VERSION:-0.0.0-dev}
      COMMIT: ${COMMIT:-unknown}
      BUILT_AT: ${BUILT_AT:-unknown}
  env_file:
    - path: .env
      required: false
  # The image runs as uid 65532 and needs no writable files and no Linux
  # capabilities: a compromised process can change nothing in its container.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-db-url: &db-url
  DATABASE_URL: postgres://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime}@postgres:5432/${POSTGRES_DB:-uptime}?sslmode=disable

services:
  postgres:
    # Pinned exactly (never "latest"). Keep in sync with pgtest.Image, so
    # integration tests run against the same server version.
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime}
      POSTGRES_DB: ${POSTGRES_DB:-uptime}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready succeeds once the server accepts connections. $$ escapes
      # compose interpolation, so the variables expand inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Runs once and exits. api and worker start only if it exits with 0, so a
  # failed migration keeps the old schema and nothing new starts on it.
  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    environment:
      <<: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["/app/api"]
    environment:
      <<: *db-url
      HTTP_ADDR: ":8080"
      OPS_ADDR: ":9090"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${API_OPS_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image has no curl: the binary probes its own /healthz.
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # SIGTERM, then up to 30 s before SIGKILL. SHUTDOWN_TIMEOUT (25 s)
    # stays below it, so a graceful shutdown always gets to finish.
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *db-url
      OPS_ADDR: ":9091"
    ports:
      - "127.0.0.1:${WORKER_OPS_PORT:-9091}:9091"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/worker", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
